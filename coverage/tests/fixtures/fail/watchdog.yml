# Fixture: a valid caller contract that MUST still fail the guard, because
# workflows/deploy.yml is run-producing and is neither watched nor excluded.
# Used by the negative smoke step, which asserts a non-zero exit.
name: Retry on runner loss
on:
  workflow_run:
    workflows:
      - Check Lint on PR
      - Retry on runner loss
    types: [completed]
permissions:
  contents: read
  actions: write
  pull-requests: write
  checks: read
jobs:
  retry:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
      || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: southernlights-tech/retry-runner-loss-action@v1
        with:
          repo: ${{ github.repository }}
